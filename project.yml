# XcodeGen 프로젝트 정의. DayGrid.xcodeproj는 이 파일로 생성하며 커밋하지 않는다.
#   brew install xcodegen && xcodegen generate
name: DayGrid

options:
  bundleIdPrefix: io.github.swpark3179
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: ko
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Phase 3(TestFlight)에서 팀 ID를 정한다.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

packages:
  DayGridCore:
    path: Packages/DayGridCore

targets:
  DayGrid:
    type: application
    platform: iOS
    sources:
      - path: DayGrid
        excludes:
          - "Info.plist"
          - "DayGrid.entitlements"
          - "Resources/markdown"
          - "Resources/markdown/**"
      # 본문 미리보기(markdown-it, DOMPurify, preview.html). 폴더째 번들의 markdown/에 들어간다.
      - path: DayGrid/Resources/markdown
        type: folder
        buildPhase: resources
    dependencies:
      - package: DayGridCore
      # 잠금화면 위젯. 앱 안(PlugIns)에 넣는다.
      - target: DayGridWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.swpark3179.DayGrid
        PRODUCT_NAME: DayGrid
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        # 배열 키(백그라운드 새로 고침)만 담은 파일. 나머지 키는 아래 INFOPLIST_KEY_*로 만든다.
        INFOPLIST_FILE: DayGrid/Info.plist
        # iCloud(CloudKit) 동기화. CI 시뮬레이터 빌드는 서명하지 않으므로 적용되지 않는다.
        CODE_SIGN_ENTITLEMENTS: DayGrid/DayGrid.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: DayGrid
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # 표준 암호화(HTTPS 등)만 쓴다. TestFlight 업로드마다 수출 규정 질문을 건너뛴다.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSContactsUsageDescription: "연락처에 적힌 생일을 가져와 달력에 표시합니다."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES

  # 잠금화면 위젯(남은 반복 할일). 앱이 App Group에 쓴 요약을 읽는다(docs/WIDGET.md).
  DayGridWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: DayGridWidgets
        excludes:
          - "Info.plist"
          - "DayGridWidgets.entitlements"
    dependencies:
      - package: DayGridCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.swpark3179.DayGrid.Widgets
        PRODUCT_NAME: DayGridWidgets
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        # NSExtension(위젯 확장 지점)만 담은 파일. 나머지 키는 아래 INFOPLIST_KEY_*로 만든다.
        INFOPLIST_FILE: DayGridWidgets/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: DayGrid
        CODE_SIGN_ENTITLEMENTS: DayGridWidgets/DayGridWidgets.entitlements
        SKIP_INSTALL: YES

  DayGridTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DayGridTests
    dependencies:
      - target: DayGrid
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.swpark3179.DayGridTests
        GENERATE_INFOPLIST_FILE: YES

  DayGridUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DayGridUITests
    dependencies:
      - target: DayGrid
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.swpark3179.DayGridUITests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  DayGrid:
    build:
      targets:
        DayGrid: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DayGridTests
        - DayGridUITests
    archive:
      config: Release
