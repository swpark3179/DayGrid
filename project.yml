# XcodeGen 프로젝트 정의. DayGrid.xcodeproj는 이 파일로 생성하며 커밋하지 않는다.
#   brew install xcodegen && xcodegen generate
name: DayGrid

options:
  bundleIdPrefix: io.github.swpark3179
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: ko
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Phase 3(TestFlight)에서 팀 ID를 정한다.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

packages:
  DayGridCore:
    path: Packages/DayGridCore

targets:
  DayGrid:
    type: application
    platform: iOS
    sources:
      - path: DayGrid
    dependencies:
      - package: DayGridCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.swpark3179.DayGrid
        PRODUCT_NAME: DayGrid
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: DayGrid
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES

  DayGridTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DayGridTests
    dependencies:
      - target: DayGrid
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.swpark3179.DayGridTests
        GENERATE_INFOPLIST_FILE: YES

  DayGridUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DayGridUITests
    dependencies:
      - target: DayGrid
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.swpark3179.DayGridUITests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  DayGrid:
    build:
      targets:
        DayGrid: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DayGridTests
        - DayGridUITests
    archive:
      config: Release
