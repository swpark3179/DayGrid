name: TestFlight

# 수동 실행: Actions → TestFlight → Run workflow. 준비 방법은 docs/TESTFLIGHT.md.
on:
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    name: Archive and upload to TestFlight
    runs-on: macos-26
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - name: Check secrets
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          missing=0
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::GitHub Secret $name is not set. See docs/TESTFLIGHT.md"
              missing=1
            fi
          done
          exit $missing

      - name: Write App Store Connect API key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          key_dir="$RUNNER_TEMP/private_keys"
          mkdir -p "$key_dir"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$key_dir/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$key_dir/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$key_dir/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Show toolchain
        run: xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      # 깨끗한 러너에서 자동 서명으로 아카이브하면 매번 개발 인증서를 새로 만들어 한도에 걸린다.
      # 그래서 아카이브는 서명 없이 만들고, 내보낼 때 API 키로 Apple 클라우드 배포 인증서 서명을 받는다.
      - name: Archive (unsigned)
        run: |
          mkdir -p build
          set -o pipefail
          xcodebuild archive \
            -project DayGrid.xcodeproj \
            -scheme DayGrid \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/DayGrid.xcarchive \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -quiet \
            2>&1 | tee build/archive.log

      - name: Ad-hoc sign the archived app
        run: codesign --force --sign - --timestamp=none build/DayGrid.xcarchive/Products/Applications/DayGrid.app

      - name: Sign with cloud signing and upload to App Store Connect
        run: |
          sed "s/__TEAM_ID__/$APPLE_TEAM_ID/" scripts/ci/ExportOptions.plist > build/ExportOptions.plist
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/DayGrid.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee build/export.log
          echo "### TestFlight 빌드 $BUILD_NUMBER 업로드 완료" >> "$GITHUB_STEP_SUMMARY"
          echo "App Store Connect에서 처리(10~30분)가 끝나면 TestFlight 앱에 나타난다." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: testflight-logs
          path: build/*.log
          if-no-files-found: ignore

      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/private_keys"
