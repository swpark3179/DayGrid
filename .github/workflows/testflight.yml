name: TestFlight

# 수동 실행: Actions → TestFlight → Run workflow. 준비 방법은 docs/TESTFLIGHT.md.
on:
  workflow_dispatch:
    inputs:
      upload:
        description: "App Store Connect에 올린다. 끄면 서명까지만 하고 올리지 않는다(서명 확인용)."
        type: boolean
        default: true

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    name: Archive and upload to TestFlight
    runs-on: macos-26
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - name: Check secrets
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          DIST_P12_BASE64: ${{ secrets.DIST_P12_BASE64 }}
          SECRETS_TOKEN: ${{ secrets.SECRETS_TOKEN }}
        run: |
          missing=0
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::GitHub Secret $name is not set. See docs/TESTFLIGHT.md"
              missing=1
            fi
          done
          # 배포 인증서(DIST_P12_BASE64)가 아직 없으면, 처음 한 번 만들어 Secrets에 넣을 토큰이 있어야 한다.
          if [ -z "$DIST_P12_BASE64" ] && [ -z "$SECRETS_TOKEN" ]; then
            echo "::error::배포 인증서 Secret(DIST_P12_BASE64)이 없다. docs/TESTFLIGHT.md 5-1대로 SECRETS_TOKEN을 넣고 다시 실행한다."
            missing=1
          fi
          exit $missing

      - name: Write App Store Connect API key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          key_dir="$RUNNER_TEMP/private_keys"
          mkdir -p "$key_dir"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$key_dir/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$key_dir/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$key_dir/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      # 승인된 버전에는 빌드를 더 올릴 수 없다(90186 "train … closed", 90062 "must contain a higher version").
      # 업로드 끝에서야 실패하므로(빌드 19), 아카이브 전에 MARKETING_VERSION을 App Store Connect의 버전과 비교한다.
      # API를 읽지 못하면 경고만 하고 넘어간다.
      - name: Check app version
        run: python3 scripts/ci/asc_signing.py check-version --project project.yml --bundle-id io.github.swpark3179.DayGrid

      - name: Show toolchain
        run: xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      # 깨끗한 러너에서 자동 서명으로 아카이브하면 매번 개발 인증서를 새로 만들어 한도에 걸린다.
      # 그래서 아카이브는 서명 없이 만들고, 내보낼 때 배포 인증서로 서명한다.
      - name: Archive (unsigned)
        run: |
          mkdir -p build
          set -o pipefail
          xcodebuild archive \
            -project DayGrid.xcodeproj \
            -scheme DayGrid \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/DayGrid.xcarchive \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -quiet \
            2>&1 | tee build/archive.log

      # 내보낼 때 Xcode는 아카이브 안 앱의 entitlements로 프로파일과 최종 서명을 정한다.
      # 서명 없이 아카이브했으므로 여기서 entitlements(배포용 값)를 넣어 ad-hoc 서명한다.
      # - 위젯 확장(PlugIns/DayGridWidgets.appex)을 먼저, 그다음 앱을 서명한다(바깥 서명이 안쪽을 덮는다).
      # - 앱: iCloud, 푸시, App Group / 위젯: App Group
      # 키 이름에 점이 있어 plutil 대신 PlistBuddy로 고친다.
      - name: Ad-hoc sign the archived app with entitlements
        run: |
          app=build/DayGrid.xcarchive/Products/Applications/DayGrid.app
          appex="$app/PlugIns/DayGridWidgets.appex"
          group=group.io.github.swpark3179.DayGrid

          codesign --force --sign - --timestamp=none --entitlements DayGridWidgets/DayGridWidgets.entitlements "$appex"
          codesign -d --entitlements - --xml "$appex" > build/archived-widget-entitlements.plist
          plutil -p build/archived-widget-entitlements.plist

          entitlements=build/DayGrid.distribution.entitlements
          cp DayGrid/DayGrid.entitlements "$entitlements"
          /usr/libexec/PlistBuddy -c "Set :aps-environment production" "$entitlements"
          /usr/libexec/PlistBuddy -c "Add :com.apple.developer.icloud-container-environment string Production" "$entitlements"
          codesign --force --sign - --timestamp=none --entitlements "$entitlements" "$app"
          codesign -d --entitlements - --xml "$app" > build/archived-entitlements.plist
          plutil -p build/archived-entitlements.plist

          container=$(/usr/libexec/PlistBuddy -c "Print :com.apple.developer.icloud-container-identifiers:0" build/archived-entitlements.plist)
          if [ "$container" != "iCloud.io.github.swpark3179.DayGrid" ]; then
            echo "::error::The archived app is missing the iCloud container entitlement"
            exit 1
          fi
          for plist in build/archived-entitlements.plist build/archived-widget-entitlements.plist; do
            if [ "$(/usr/libexec/PlistBuddy -c "Print :com.apple.security.application-groups:0" "$plist")" != "$group" ]; then
              echo "::error::$plist is missing the App Group entitlement"
              exit 1
            fi
          done

      # Xcode 자동 서명(클라우드 서명)은 iCloud 컨테이너를 찾을 때 API 키로 인증하지 못한다
      # (`xcbuild/v1/cloudContainers` → 401, 실행 #3·#4). 그래서 App Store Connect 공개 API로
      # 배포 인증서와 App Store 프로파일을 준비하고, 수동 서명으로 내보낸다.
      # - 배포 인증서는 Secrets(DIST_P12_BASE64, DIST_P12_PASSWORD)에 둔 것을 계속 쓰고, 폐기하지 않는다.
      #   폐기한 인증서로 서명한 빌드는 App Store 심사에서 "잘못된 바이너리"가 된다(2026-11 첫 심사).
      #   Secret이 없거나 인증서가 만료됐으면 SECRETS_TOKEN으로 새로 만들어 넣는다.
      # - 프로파일("DayGrid CI <번들 ID>")은 지우지 않고 다시 쓴다.
      # 프로파일의 iCloud 컨테이너·App Group은 developer.apple.com의 App ID 설정을 따른다.
      - name: Prepare signing certificate and profiles
        env:
          UPLOAD: ${{ inputs.upload }}
          DIST_P12_BASE64: ${{ secrets.DIST_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
          SECRETS_TOKEN: ${{ secrets.SECRETS_TOKEN }}
        run: |
          destination=upload
          if [ "$UPLOAD" = "false" ]; then
            destination=export
          fi
          keychain_password=$(uuidgen)
          echo "::add-mask::$keychain_password"
          python3 scripts/ci/asc_signing.py prepare \
            --archive build/DayGrid.xcarchive \
            --out build/signing \
            --destination "$destination" \
            --export-options build/ExportOptions.plist
          p12_password=$(cat build/signing/p12-password)
          echo "::add-mask::$p12_password"

          keychain="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          # 배포 인증서의 중간 인증서. 러너에 이미 있으면 받지 못해도 괜찮다.
          if ! { curl -fsSL -o build/signing/AppleWWDRCAG3.cer https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer \
            && security import build/signing/AppleWWDRCAG3.cer -k "$keychain"; }; then
            echo "::warning::Apple WWDR G3 중간 인증서를 넣지 못했다."
          fi
          security import build/signing/distribution.p12 -k "$keychain" -P "$p12_password" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain"

      - name: Export and upload to App Store Connect
        env:
          UPLOAD: ${{ inputs.upload }}
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/DayGrid.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee build/export.log
          if [ "$UPLOAD" = "false" ]; then
            # 올리지 않을 때는 만든 .ipa의 최종 entitlements를 보여준다(iCloud, 푸시, App Group 확인).
            unzip -q build/export/*.ipa -d build/ipa
            for bundle in build/ipa/Payload/*.app/PlugIns/*.appex build/ipa/Payload/*.app; do
              [ -d "$bundle" ] || continue
              echo "== $(basename "$bundle")"
              codesign -d --entitlements - --xml "$bundle" 2>/dev/null | plutil -p -
            done
            echo "### 서명 확인 완료(빌드 $BUILD_NUMBER, 올리지 않음)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### TestFlight 빌드 $BUILD_NUMBER 업로드 완료" >> "$GITHUB_STEP_SUMMARY"
            echo "App Store Connect에서 처리(10~30분)가 끝나면 TestFlight 앱에 나타난다." >> "$GITHUB_STEP_SUMMARY"
          fi

      # 내보내기 오류는 "Authentication failed"처럼 짧게만 나온다. 원인(어느 요청이 몇 번 응답으로 실패했는지)은
      # Xcode 배포 로그에 있으므로 실패하면 그 부분만 출력한다. 인증 토큰이 찍힐 수 있는 줄은 지운다.
      - name: Show distribution logs
        if: failure()
        run: |
          tmp="${TMPDIR:-$(getconf DARWIN_USER_TEMP_DIR)}"
          for dir in "$tmp"/*.xcdistributionlogs; do
            [ -d "$dir" ] || continue
            echo "== $(basename "$dir")"
            ls "$dir"
            for log in "$dir"/*.log; do
              echo "--- $(basename "$log")"
              grep -iE "error|fail|denied|unauthori|forbidden|[^0-9](401|403|404|409)[^0-9]|profile|capabilit|icloud|container|entitlement|application-groups" "$log" \
                | grep -viE "authorization|bearer|cookie|token" \
                | sed -E 's/eyJ[A-Za-z0-9._-]+/<redacted>/g' \
                | cut -c1-400 \
                | tail -n 120 || true
            done
          done

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: testflight-logs
          path: build/*.log
          if-no-files-found: ignore

      # 러너에 남은 키체인과 인증서 파일만 지운다. App Store Connect의 인증서와 프로파일은 그대로 둔다
      # (인증서를 폐기하면 그 인증서로 서명한 빌드가 심사에서 잘못된 바이너리가 된다).
      - name: Remove local signing files
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -rf build/signing

      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/private_keys"
